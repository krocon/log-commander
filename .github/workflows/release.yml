# Builds installable packages with tauri-action and attaches them to a DRAFT release. Nothing is
# published automatically. Trigger: push a tag v*, or run the workflow by hand.
#
# Signing is optional: without the secrets below the packages are unsigned (macOS: Gatekeeper
# warning, Windows: SmartScreen warning). Secrets to set for a signed, notarised macOS build:
#   APPLE_CERTIFICATE            base64 of the .p12 "Developer ID Application" certificate
#   APPLE_CERTIFICATE_PASSWORD   its password
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Marc Kronberg (TEAMID)"
#   APPLE_ID                     Apple account for notarisation
#   APPLE_PASSWORD               app-specific password of that account
#   APPLE_TEAM_ID                team id
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            args: --bundles msi,nsis
          - os: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Missing secrets arrive as empty strings, and Tauri then tries to import an empty certificate and fails.
      # So the Apple variables are only set when the certificate is there; otherwise the app is signed ad hoc.
      - name: Apple signing (only with secrets)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No APPLE_CERTIFICATE secret: macOS packages are signed ad hoc, not notarised."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
            fi
          done
      # Prompt 022: the MCP sidecar `log-commander-mcp` next to the app (`bundle.externalBin` in tauri.sidecar.conf.json).
      - name: MCP sidecar
        shell: bash
        run: node scripts/mcp-sidecar.mjs ${{ runner.os == 'macOS' && 'universal-apple-darwin' || '' }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Log Commander ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.sidecar.conf.json
