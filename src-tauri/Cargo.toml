[package]
name = "log-commander"
version = "1.0.0"
description = "Fast, colourful live log viewer"
authors = ["Marc Kronberg"]
license = "MIT"
repository = "https://github.com/krocon/log-commander"
edition = "2021"
rust-version = "1.89"

[lib]
name = "log_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Local time zone for timestamps without a zone (timestamp.rs, shared with the merge of prompt 006).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
# Fast newline scan while indexing; already in the tree through regex.
memchr = "2"
notify = "8.2"
parking_lot = "0.12"
regex = "1"
# Remote logs over SSH/SFTP (prompt 017, spike in prompts/done/017-remote-sftp.design.md): pure Rust, no
# OpenSSL (ring), the same set as files-and-folders-tauri. Only the `sftp` subsystem is ever requested.
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
# Own known_hosts parser (security review 017 M1): hashed hosts are HMAC-SHA1 with Base64 salts;
# all three are already in the tree through russh.
data-encoding = "2"
hmac = "0.13"
sha1 = "0.11"
# Keychain account names (hash of user@host:port) – already in the tree through russh.
sha2 = "0.11"
# Passwords and passphrases only in the OS keychain, on explicit request (prompt 017).
keyring-core = "1"
# The async SSH code runs on a small runtime of its own; tokio is in the tree through Tauri.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "io-util", "macros"] }
# Secrets are wiped from memory when dropped.
zeroize = "1.8"
# Dashboard (prompt 012): SQL over a per-session table of entry heads. Bundled, without extension
# loading (see `.cargo/config.toml`); `hooks` for the authorizer and the time limit, `functions` for
# `bucket()`, `limits` for length and attach limits; `column_decltype` for the declared types of the
# SQLite source (prompt 019).
rusqlite = { version = "0.41", features = ["bundled", "functions", "hooks", "limits", "column_decltype"] }
# Logs from databases (prompt 019, spike in prompts/done/019-datenbank-logs.design.md): pure Rust drivers, TLS
# over rustls with the roots of the OS. The sqlx sub-crates instead of the `sqlx` facade: the facade names
# `sqlx-sqlite` (libsqlite3-sys 0.37) even when unused, and two `links = "sqlite3"` cannot share a build with
# rusqlite above, which also reads the SQLite source.
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-native-roots", "chrono"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["chrono"] }
sqlx-mysql = { version = "=0.9.0", default-features = false, features = ["chrono"] }
# SQL Server (TDS); 0.13 brings rustls with aws-lc-rs (bundled C, no system library). The ring provider is
# installed as the process default, so both use the same crypto.
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-cli = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
thiserror = "2"

# Free disk space before building the dashboard database (prompt 012).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Keychain of the OS (prompt 017): Secret Service over D-Bus on Linux, Keychain on macOS, Credential
# Manager on Windows.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

# File identity (rotation detection) needs GetFileInformationByHandle on Windows, the event logs of
# prompt 018 the Evt* API.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }
# Event logs (prompt 018): EvtQuery/EvtSubscribe/EvtRender/EvtFormatMessage, the signal event of a
# subscription (Threading, whose CreateEventW takes Security's SECURITY_ATTRIBUTES).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_EventLog",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
