[package]
name = "log-commander"
version = "0.1.0"
description = "Fast, colourful live log viewer"
authors = ["Marc Kronberg"]
license = "MIT"
repository = "https://github.com/krocon/log-commander"
edition = "2021"
rust-version = "1.89"

[lib]
name = "log_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Local time zone for timestamps without a zone (timestamp.rs, shared with the merge of prompt 006).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
# Fast newline scan while indexing; already in the tree through regex.
memchr = "2"
notify = "8.2"
parking_lot = "0.12"
regex = "1"
# Dashboard (prompt 012): SQL over a per-session table of entry heads. Bundled, without extension
# loading (see `.cargo/config.toml`); `hooks` for the authorizer and the time limit, `functions` for
# `bucket()`, `limits` for length and attach limits.
rusqlite = { version = "0.41", features = ["bundled", "functions", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-cli = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
thiserror = "2"

# Free disk space before building the dashboard database (prompt 012).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# File identity (rotation detection) needs GetFileInformationByHandle on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
